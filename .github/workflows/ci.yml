name: API QA Pipeline (Jest & Postman)

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Contenedor de servicios para levantar MongoDB localmente en el runner
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Ejecutar Pruebas Unitarias e Integración (Jest)
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/cerveceria_test
          JWT_SECRET: super_secret_test
          JWT_EXPIRES_IN: 1d
        run: npm test

      - name: Iniciar servidor en segundo plano para Postman
        env:
          NODE_ENV: development
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/cerveceria_test
          JWT_SECRET: super_secret_test
          JWT_EXPIRES_IN: 1d
        run: |
          npm run dev &
          sleep 5 # Esperar 5 segundos a que la BD y el servidor inicien

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar Colección de Postman con Newman
        run: newman run tests/postman/cerveza.postman_collection.json -e tests/postman/Test.postman_environment.json
